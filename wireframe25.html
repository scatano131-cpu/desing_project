<script>const B={'BEC-2026-0187':['Fondo de Becas UNAB','En revisión','#e9a427','02/10/2026','Pendiente de definir'],'BEC-2026-0093':['Vamos Pa´lante Colombia','Aprobada','#2f8a2c','18/08/2026','50 % del valor de la matrícula'],'BEC-2025-0412':['Excelencia académica','Finalizada','#777','21/02/2025','Beneficio cumplido']};
const $=id=>document.getElementById(id);const fill=()=>{$('ids').innerHTML='<option value="">Seleccione un ID</option>'+Object.keys(B).map(k=>'<option>'+k+'</option>').join('')};fill();
$('cons').onclick=()=>{const k=$('ids').value;if(!k){$('out').innerHTML='<p class="res no">Selecciona un ID para consultar.</p>';return}const d=B[k];
 $('out').innerHTML='<div class="rescard"><h3>'+k+'</h3><p><b>Tipo:</b> '+d[0]+'</p><p><b>Estado:</b> <span class="st-b" style="background:'+d[2]+'">'+d[1]+'</span></p><p><b>Fecha de solicitud:</b> '+d[3]+'</p><p><b>Beneficio:</b> '+d[4]+'</p></div>'};
$('nueva').onclick=()=>Portal.form('Nueva solicitud de beca','Cuéntanos qué beca quieres solicitar.',[{id:'t',label:'Tipo de beca',type:'select',opts:['Fondo de Becas UNAB','Vamos Pa´lante Colombia','Excelencia académica']},{id:'m',label:'¿Por qué la necesitas?',type:'textarea'}],v=>{const id='BEC-2026-0'+(200+Object.keys(B).length);B[id]=[v.t,'En revisión','#e9a427',new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'}),'Pendiente de definir'];fill();$('ids').value=id;$('cons').click();return 'Solicitud creada con el ID '+id+'. Ya puedes consultarla.'});</script></body></html>
