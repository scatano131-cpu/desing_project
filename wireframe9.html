  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
    body {
      font-family: 'Open Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff; color: #2b2b2b;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    .top-header {
      position: sticky; top: 0; left: 0; width: 100%; height: 11.33vw;
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 8.2vw; padding-right: 7.3vw; z-index: 100;
    }
    .hdr-gold   { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.98) 48%, rgba(247,236,214,.92) 78%, rgba(235,209,162,.95) 100%); }
    .hdr-purple { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.98) 48%, rgba(238,222,250,.92) 78%, rgba(214,170,242,.95) 100%); }
    .hdr-gray   { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.97) 38%, rgba(246,246,246,.78) 75%, rgba(236,236,236,.65) 100%); border-bottom: 1px solid rgba(0,0,0,.05); }
    .user-profile { display: flex; align-items: center; gap: 1.15vw; margin-top: .2vw; cursor: pointer; }
    .avatar-circle { width: 4.1vw; height: 4.1vw; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .avatar-circle svg { width: 100%; height: 100%; display: block; }
    .user-text { display: flex; flex-direction: column; justify-content: center; }
    .user-name { color: #4a4a4a; font-size: 1.4vw; font-weight: 500; line-height: 1.15; }
    .user-role { color: #e9a427; font-size: 1.1vw; line-height: 1.15; }
    .header-brand { display: flex; align-items: center; margin-top: .2vw; cursor: pointer; position: relative; }
    .logo-wrapper { width: 16.03vw; height: 3.4vw; overflow: hidden; position: relative; flex-shrink: 0; }
    .logo-wrapper img { width: 23.77vw; height: auto; position: absolute; left: -4.11vw; top: -5.85vw; user-select: none; pointer-events: none; }
    .chevron-down { width: 3.46vw; height: 1.9vw; margin-left: .9vw; margin-top: .25vw; flex-shrink: 0; transition: transform .2s; }
    .header-brand.open .chevron-down { transform: rotate(180deg); }
    .menu {
      display: none; position: absolute; top: 100%; right: 0; margin-top: .8vw; min-width: 15vw;
      background: #fff; border-radius: 1vw; box-shadow: 0 .4vw 1.6vw rgba(0,0,0,.18);
      padding: .6vw 0; z-index: 200;
    }
    .header-brand.open .menu { display: block; }
    .menu a { display: block; padding: .6vw 1.4vw; font-size: 1.05vw; color: #444; }
    .menu a:hover { background: #f4ecfb; color: #8600dd; }
    .menu hr { border: 0; border-top: 1px solid #eee; margin: .4vw 0; }

    .banner {
      width: 100%; height: 6.45vw; display: flex; align-items: center; justify-content: space-between;
      padding: 0 7.42vw; box-shadow: inset 0 3px 3px rgba(0,0,0,.12);
    }
    .banner-title { color: #fff; font-size: 1.55vw; font-weight: 600; }
    .bg-orange { background: #e9a427; }
    .bg-purple { background: #8600dd; }

    .main-container { flex: 1; width: 100%; padding: 1.8vw 7.42vw 0; }
    .toolbar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5vw; width: 100%; }
    .section-title { color: #1c1c1c; font-size: 1.48vw; font-weight: 700; }
    .search-wrapper { width: 29.88vw; height: 3.32vw; }
    .search-input {
      width: 100%; height: 100%; background: #ededed; border: 1px solid #d0d0d0; border-radius: .9vw;
      padding: 0 1.25vw; font-size: 1.05vw; font-family: inherit; color: #333; outline: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input::placeholder { color: #c0c0c0; }
    .search-input:focus { border-color: #8600dd; box-shadow: 0 0 0 2px rgba(134,0,221,.12); }

    .footer {
      margin-top: 4.8vw; width: 100%; height: 4.74vw; background: #8600dd; color: #fff;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 1.15vw; font-weight: 600; flex-shrink: 0;
    }
    @media (max-width: 700px) {
      .top-header { height: 24vw; }
      .avatar-circle { width: 11vw; height: 11vw; }
      .user-name { font-size: 3.6vw; } .user-role { font-size: 3vw; }
      .logo-wrapper { width: 36vw; height: 7.6vw; }
      .logo-wrapper img { width: 53vw; left: -9.2vw; top: -13vw; }
      .chevron-down { width: 7vw; height: 4vw; }
      .menu { min-width: 48vw; } .menu a { font-size: 3.6vw; padding: 2vw 4vw; }
      .banner { height: 16vw; padding: 0 5vw; flex-wrap: wrap; }
      .banner-title { font-size: 4.4vw; }
      .main-container { padding: 4vw 5vw 0; }
      .section-title { font-size: 4.2vw; }
      .search-wrapper { width: 48vw; height: 9vw; } .search-input { font-size: 3.2vw; border-radius: 2vw; }
      .footer { height: 14vw; font-size: 3vw; margin-top: 10vw; }
    }

    .top-header { position: fixed; }
    .hero { width: 100%; height: 30.9vw; overflow: hidden; border-bottom: 2px solid #8600dd; }
    .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
    .article-wrap { position: relative; flex: 1; padding: 0 7.42vw; }
    .btn-volver {
      position: absolute; left: 6.9vw; top: 0; background: #e9a427; color: #fff; font-size: 1.05vw; font-weight: 600;
      padding: .75vw 1.3vw .75vw .9vw; border-radius: 0 0 .9vw .9vw; display: flex; align-items: center; gap: .5vw;
      box-shadow: 0 2px 4px rgba(0,0,0,.14);
    }
    .btn-volver svg { width: .8vw; height: 1.2vw; }
    .btn-volver:hover { filter: brightness(.95); }
    .article { margin-left: 13.7vw; max-width: 49vw; padding-top: 2.2vw; }
    .article h1 { color: #8600dd; font-size: 1.85vw; font-weight: 700; line-height: 1.3; }
    .article .fecha { color: #c4c4c4; font-size: 1.05vw; margin: 1.4vw 0 1.4vw; }
    .article p { font-size: 1.05vw; line-height: 1.65; color: #3a3a3a; margin-bottom: 1.5vw; }
    .article p a { color: #8600dd; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 700px) {
      .hero { height: 52vw; }
      .btn-volver { position: static; display: inline-flex; font-size: 3.2vw; padding: 2vw 3.5vw 2vw 2.5vw; border-radius: 0 0 3vw 3vw; margin-left: 0; }
      .btn-volver svg { width: 2.4vw; height: 3.6vw; }
      .article-wrap { padding: 0 5vw; } .article { margin-left: 0; max-width: none; padding-top: 4vw; }
      .article h1 { font-size: 5vw; } .article .fecha { font-size: 3vw; } .article p { font-size: 3.5vw; margin-bottom: 4vw; }
    }
