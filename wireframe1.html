<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiportalU - Universidad UNAB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
    }

    .main-container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .left-panel {
      width: 56.84%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    .left-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .right-panel {
      width: 43.16%;
      height: 100%;
      background-color: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      padding-right: 6.64vw;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 14.6vh;
      width: 100%;
      z-index: 2;
    }


    .logo-unab {
      height: 20.67vh;
      width: auto;
      display: block;
      user-select: none;
    }

    .logo-miportalu {
      width: 24.33vw;
      max-width: 340px;
      min-width: 210px;
      height: auto;
      margin-top: -8.3vh;
      margin-bottom: -2.8vh;
      display: block;
      user-select: none;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 21vw;
      min-width: 205px;
      max-width: 290px;
      margin-top: 0.7vh;
    }

    .input-field {
      width: 100%;
      height: 6.69vh;
      min-height: 36px;
      max-height: 46px;
      background-color: #ededed;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 11px;
      color: #555555;
      outline: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.16), inset 0 1px 2px rgba(0, 0, 0, 0.06);
      margin-bottom: 3.35vh;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field::placeholder {
      color: #c6c6c6;
      font-weight: 400;
    }

    .input-field:focus {
      border-color: #b5b5b5;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.22);
    }

    .btn-ingresar {
      margin-top: 1.23vh;
      width: 8.3vw;
      min-width: 82px;
      max-width: 115px;
      height: 4.58vh;
      min-height: 25px;
      max-height: 34px;
      background-color: #8600dd;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.2px;
      transition: background-color 0.2s;
    }

    .btn-ingresar:hover {
      background-color: #7200bd;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.76vh;
      gap: 0.7vh;
    }

    .link-crear {
      color: #8600dd;
      font-size: 9px;
      text-decoration: none;
      font-weight: 400;
    }

    .link-crear:hover {
      text-decoration: underline;
    }

    .link-olvido {
      color: #cccccc;
      font-size: 9px;
      text-decoration: none;
      font-weight: 400;
    }

    .link-olvido:hover {
      color: #999999;
      text-decoration: underline;
    }

    .decor-top-right {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      z-index: 1;
    }

    .decor-top-right img {
      width: 10.74vw;
      min-width: 105px;
      height: auto;
      display: block;
      margin-right: -5.37vw;
      margin-top: -1.94vh;
      margin-bottom: -1.76vh;
    }

    .decor-top-right img:first-child {
      margin-top: -2.11vh;
    }

    .decor-bottom-left {
      position: absolute;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: none;
      z-index: 1;
    }

    .decor-bottom-left .bar-horiz {
      width: 13.84vw;
      min-width: 135px;
      height: auto;
      display: block;
      margin-left: -4.5vw;
      margin-bottom: -1.76vh;
    }

    .decor-bottom-left .circle-sq {
      width: 13.9vw;
      min-width: 136px;
      height: auto;
      display: block;
      margin-left: -4.5vw;
      margin-bottom: -2.15vh;
    }

    .decor-bottom-left .bar-vert {
      width: 13.84vw;
      min-width: 135px;
      height: auto;
      display: block;
      margin-left: -4.5vw;
      margin-bottom: -1.4vh;
      transform: rotate(90deg);
    }
  </style>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#8600dd"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="css/portal.css"><style>@media(max-width:800px){html,body{height:auto;overflow:auto}.main-container{flex-direction:column;height:auto}.left-panel{width:100%;height:32vh}.right-panel{width:100%;height:auto;padding:0 0 10vh}.login-box{margin-top:3vh}.logo-unab{height:14vh}.logo-miportalu{width:60vw;margin-top:-4vh}.login-form{width:78vw;max-width:340px}.input-field{font-size:16px;height:46px}.btn-ingresar{width:140px;height:42px;font-size:15px}.link-crear,.link-olvido{font-size:14px}.decor-top-right,.decor-bottom-left{display:none}}</style></head>
<body>
  <div class="main-container">
    <div class="left-panel">
      <img src="img/campus-unab.png" alt="Campus Universidad UNAB">
    </div>

 
    <div class="right-panel">

      <div class="decor-top-right">
        <img src="img/decor-triangulo.png" alt="">
        <img src="img/decor-triangulo.png" alt="">
        <img src="img/decor-triangulo.png" alt="">
      </div>

      <div class="login-box">
        <img class="logo-unab" src="img/logo-unab.png" alt="Universidad UNAB">
        <img class="logo-miportalu" src="img/logo-miportalu.png" alt="MiportalU">

        <form class="login-form" onsubmit="event.preventDefault();location.href='wireframe2.html'">
          <input type="text" class="input-field" placeholder="Usuario" required aria-label="Usuario" autocomplete="username">
          <input type="password" class="input-field" placeholder="Contraseña" required aria-label="Contraseña" autocomplete="current-password">
          <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>

        <div class="links-container">
          <a href="wireframe10.html" class="link-crear">Crear Usuario</a>
          <a href="wireframe10.html" class="link-olvido">¿Olvidó su contraseña?</a>
        </div>
      </div>

      <!-- Decoración Inferior Izquierda -->
      <div class="decor-bottom-left">
        <img class="bar-horiz" src="img/decor-barra.png" alt="">
        <img class="circle-sq" src="img/decor-circulo.png" alt="">
        <img class="bar-vert" src="img/decor-barra.png" alt="">
      </div>
    </div>
  </div>
