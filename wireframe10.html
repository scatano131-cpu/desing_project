<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiportalU - Crear Usuario | Universidad UNAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
    body {
      font-family: 'Open Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff; color: #2b2b2b;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    .top-header {
      position: sticky; top: 0; left: 0; width: 100%; height: 11.33vw;
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 8.2vw; padding-right: 7.3vw; z-index: 100;
    }
    .hdr-gold   { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.98) 48%, rgba(247,236,214,.92) 78%, rgba(235,209,162,.95) 100%); }
    .hdr-purple { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.98) 48%, rgba(238,222,250,.92) 78%, rgba(214,170,242,.95) 100%); }
    .hdr-gray   { background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,.97) 38%, rgba(246,246,246,.78) 75%, rgba(236,236,236,.65) 100%); border-bottom: 1px solid rgba(0,0,0,.05); }
    .user-profile { display: flex; align-items: center; gap: 1.15vw; margin-top: .2vw; cursor: pointer; }
    .avatar-circle { width: 4.1vw; height: 4.1vw; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .avatar-circle svg { width: 100%; height: 100%; display: block; }
    .user-text { display: flex; flex-direction: column; justify-content: center; }
    .user-name { color: #4a4a4a; font-size: 1.4vw; font-weight: 500; line-height: 1.15; }
    .user-role { color: #e9a427; font-size: 1.1vw; line-height: 1.15; }
    .header-brand { display: flex; align-items: center; margin-top: .2vw; cursor: pointer; position: relative; }
    .logo-wrapper { width: 16.03vw; height: 3.4vw; overflow: hidden; position: relative; flex-shrink: 0; }
    .logo-wrapper img { width: 23.77vw; height: auto; position: absolute; left: -4.11vw; top: -5.85vw; user-select: none; pointer-events: none; }
    .chevron-down { width: 3.46vw; height: 1.9vw; margin-left: .9vw; margin-top: .25vw; flex-shrink: 0; transition: transform .2s; }
    .header-brand.open .chevron-down { transform: rotate(180deg); }
    .menu {
      display: none; position: absolute; top: 100%; right: 0; margin-top: .8vw; min-width: 15vw;
      background: #fff; border-radius: 1vw; box-shadow: 0 .4vw 1.6vw rgba(0,0,0,.18);
      padding: .6vw 0; z-index: 200;
    }
    .header-brand.open .menu { display: block; }
    .menu a { display: block; padding: .6vw 1.4vw; font-size: 1.05vw; color: #444; }
    .menu a:hover { background: #f4ecfb; color: #8600dd; }
    .menu hr { border: 0; border-top: 1px solid #eee; margin: .4vw 0; }

    .banner {
      width: 100%; height: 6.45vw; display: flex; align-items: center; justify-content: space-between;
      padding: 0 7.42vw; box-shadow: inset 0 3px 3px rgba(0,0,0,.12);
    }
    .banner-title { color: #fff; font-size: 1.55vw; font-weight: 600; }
    .bg-orange { background: #e9a427; }
    .bg-purple { background: #8600dd; }

    .main-container { flex: 1; width: 100%; padding: 1.8vw 7.42vw 0; }
    .toolbar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5vw; width: 100%; }
    .section-title { color: #1c1c1c; font-size: 1.48vw; font-weight: 700; }
    .search-wrapper { width: 29.88vw; height: 3.32vw; }
    .search-input {
      width: 100%; height: 100%; background: #ededed; border: 1px solid #d0d0d0; border-radius: .9vw;
      padding: 0 1.25vw; font-size: 1.05vw; font-family: inherit; color: #333; outline: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input::placeholder { color: #c0c0c0; }
    .search-input:focus { border-color: #8600dd; box-shadow: 0 0 0 2px rgba(134,0,221,.12); }

    .footer {
      margin-top: 4.8vw; width: 100%; height: 4.74vw; background: #8600dd; color: #fff;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 1.15vw; font-weight: 600; flex-shrink: 0;
    }
    @media (max-width: 700px) {
      .top-header { height: 24vw; }
      .avatar-circle { width: 11vw; height: 11vw; }
      .user-name { font-size: 3.6vw; } .user-role { font-size: 3vw; }
      .logo-wrapper { width: 36vw; height: 7.6vw; }
      .logo-wrapper img { width: 53vw; left: -9.2vw; top: -13vw; }
      .chevron-down { width: 7vw; height: 4vw; }
      .menu { min-width: 48vw; } .menu a { font-size: 3.6vw; padding: 2vw 4vw; }
      .banner { height: 16vw; padding: 0 5vw; flex-wrap: wrap; }
      .banner-title { font-size: 4.4vw; }
      .main-container { padding: 4vw 5vw 0; }
      .section-title { font-size: 4.2vw; }
      .search-wrapper { width: 48vw; height: 9vw; } .search-input { font-size: 3.2vw; border-radius: 2vw; }
      .footer { height: 14vw; font-size: 3vw; margin-top: 10vw; }
    }

    html, body { height: 100vh; overflow: hidden; }
    .stage { display: flex; width: 100%; height: 100vh; }
    .side { flex: 0 0 27.2%; position: relative; overflow: hidden; background: #e8641e; }
    .side img { position: absolute; top: 0; height: 100%; width: auto; min-width: 100%; object-fit: cover; display: block; }
    .side.left img { left: 0; } .side.right img { right: 0; }
    .center { flex: 1; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 2vw; }
    .logo-unab { height: 17vh; width: auto; display: block; }
    .logo-miportalu { width: min(24.33vw, 340px); min-width: 200px; height: auto; margin-top: -6vh; margin-bottom: -2vh; display: block; }
    .titulo { color: #8600dd; font-size: 1.35vw; font-weight: 700; margin-top: 1.2vh; min-width: 0; font-size: clamp(16px, 1.35vw, 22px); }
    .texto { color: #333; font-size: clamp(10px, .72vw, 13px); font-weight: 700; text-align: center; margin-top: 1.4vh; line-height: 1.35; }
    .instruccion { color: #e9a427; font-size: clamp(10px, .72vw, 13px); font-weight: 700; text-align: center; margin-top: 1vh; max-width: 15vw; min-width: 190px; line-height: 1.35; }
    form { display: flex; flex-direction: column; align-items: center; width: clamp(205px, 21vw, 290px); margin-top: 3.5vh; }
    .input-field {
      width: 100%; height: clamp(36px, 6.7vh, 46px); background: #ededed; border: 1px solid #d4d4d4; border-radius: 10px;
      padding: 0 13px; font-family: inherit; font-size: 12px; color: #555; outline: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.16), inset 0 1px 2px rgba(0,0,0,.06);
    }
    .input-field::placeholder { color: #c6c6c6; }
    .input-field:focus { border-color: #8600dd; box-shadow: 0 0 0 2px rgba(134,0,221,.12); }
    .btn-crear {
      margin-top: 3.2vh; min-width: 100px; height: clamp(28px, 4.6vh, 36px); padding: 0 24px; background: #8600dd; color: #fff;
      border: 0; border-radius: 8px; font-family: inherit; font-size: 12px; cursor: pointer; transition: background .2s;
    }
    .btn-crear:hover { background: #7200bd; }
    .mensaje { margin-top: 1.6vh; min-height: 2.6vh; font-size: 11px; font-weight: 600; text-align: center; max-width: 21vw; min-width: 200px; }
    .mensaje.error { color: #d93025; } .mensaje.ok { color: #1b8a3c; }
    .volver { margin-top: 1vh; color: #8600dd; font-size: 11px; } .volver:hover { text-decoration: underline; }
    @media (max-width: 800px) { .side { flex-basis: 8%; } .center { padding: 0 4vw; } .titulo { font-size: 20px; } .texto, .instruccion { font-size: 12px; max-width: 70vw; } .mensaje { max-width: 70vw; } }
  </style>

<body>
  <div class="stage">
    <div class="side left"><img src="img/decor-lateral.png" alt=""></div>

    <div class="center">
      <img class="logo-unab" src="img/logo-unab.png" alt="Universidad UNAB">
      <img class="logo-miportalu" src="img/logo-miportalu.png" alt="MiportalU">

      <h1 class="titulo">Crear Usuario</h1>
      <p class="texto">Si haces parte de la Comunidad UNAB<br>Crea aquí tu Usuario UNAB</p>
      <p class="instruccion">Ingresa tu cédula o documento de identidad. (Solo números, sin puntos "." ni guiones "-")</p>

      <form id="formCrear" novalidate>
        <input type="text" id="cedula" class="input-field" placeholder="Cédula" inputmode="numeric" autocomplete="off" maxlength="15" aria-label="Cédula">
        <button type="submit" class="btn-crear">Crear</button>
      </form>
      <div class="mensaje" id="mensaje" role="status"></div>
      <a class="volver" href="wireframe1.html">Volver al inicio de sesión</a>
    </div>

    <div class="side right"><img src="img/decor-lateral.png" alt=""></div>
  </div>

    const applyFallback = () => { if (fallbackImages[rawSrc] && img.src !== fallbackImages[rawSrc]) img.src = fallbackImages[rawSrc]; };

  <script>
  const cedula = document.getElementById('cedula'), msg = document.getElementById('mensaje');
  cedula.addEventListener('input', () => { cedula.value = cedula.value.replace(/\D/g, ''); msg.textContent = ''; });
  document.getElementById('formCrear').addEventListener('submit', e => {
    e.preventDefault();
    if (cedula.value.length < 5) { msg.className = 'mensaje error'; msg.textContent = 'Ingresa una cédula válida (solo números).'; return; }
    msg.className = 'mensaje ok'; msg.textContent = 'Solicitud recibida. Revisa tu correo institucional para continuar.';
  });
