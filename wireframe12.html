<script>
const E='FACULTAD DE ECONOMIA Y NEGOCIOS',S='FACULTAD DE CIENCIAS DE LA SALUD',H='FACULTAD DE CIENCIAS SOCIALES HUMANIDADES Y ARTES',I='FACULTAD DE INGENIERIA',J='FACULTAD DE CIENCIAS JURIDICAS Y POLITICAS';
const P=[[E,'Maestrías','Presencial','Administración de Empresas'],[E,'Pregrado Profesional','A Distancia Virtual','Administración de Empresas'],[E,'Pregrado Profesional','Dual','Administración de Empresas'],[E,'Pregrado Profesional','Presencial','Administración de Empresas'],[E,'Pregrado Profesional','Presencial','Administración Turística y Hotelera'],[E,'Maestrías','Presencial','Administración y Dirección de Empresas'],[S,'Especializaciones Médico Quirúrgicas','Presencial','Anestesiología'],[H,'Pregrado Profesional','Presencial','Artes Audiovisuales'],[H,'Pregrado Profesional','Presencial','Artes Escénicas'],[S,'Especialización','Presencial','Auditoría en Salud'],[I,'Especialización','Presencial','Ciberseguridad Organizacional'],['OPS DEPARTAMENTO DE MATEMATICAS Y CIENCIAS NATURALES','Pregrado Profesional','Presencial','Ciencia de Datos'],[J,'Maestrías','Presencial','Ciencia Política'],[I,'Pregrado Profesional','Presencial','Ingeniería de Sistemas'],[I,'Pregrado Profesional','Presencial','Ingeniería Mecatrónica'],[S,'Pregrado Profesional','Presencial','Medicina'],[S,'Pregrado Profesional','Presencial','Enfermería'],[H,'Pregrado Profesional','Presencial','Psicología'],[J,'Pregrado Profesional','Presencial','Derecho']];
const Q=[['Humanidades','Ética y ciudadanía','2','Presencial'],['Humanidades','Pensamiento crítico','2','Virtual'],['Ciencias sociales','Cultura y sociedad','2','Presencial'],['Ciencias sociales','Historia de Colombia','2','Virtual'],['Comunicación','Argumentación y comunicación','2','Presencial'],['Ambiente','Sostenibilidad y territorio','2','Virtual'],['Arte','Arte y creatividad','2','Presencial'],['Liderazgo','Proyecto de vida y liderazgo','2','Presencial']];
let m=0,sc=-1,asc=1;const D=()=>m?Q:P,HD=()=>m?['Área','Curso','Créditos','Modalidad']:['Facultad','Nivel','Modalidad','Programa'],FC=()=>m?[0,3]:[0,1],LB=()=>m?['Área','Modalidad']:['Facultad','Nivel de Formación'],AL=()=>m?['Todas las áreas','Todas las modalidades']:['Todas las facultades','Todos los Niveles'];
const $=id=>document.getElementById(id);
function fill(){[0,1].forEach(k=>{const c=FC()[k],v=[...new Set(D().map(r=>r[c]))].sort();$('f'+k).innerHTML='<option value="">'+AL()[k]+'</option>'+v.map(x=>'<option>'+x+'</option>').join('');$('f'+k).previousSibling.textContent=LB()[k]+': '});}
function render(){let r=D().filter(x=>[0,1].every(k=>!$('f'+k).value||x[FC()[k]]===$('f'+k).value));if(sc>-1)r.sort((a,b)=>a[sc].localeCompare(b[sc],'es',{numeric:true})*asc);
 $('hd').innerHTML=HD().map((h,i)=>'<th scope="col" data-c="'+i+'" tabindex="0" title="Ordenar">'+h+(sc===i?(asc>0?' ▲':' ▼'):'')+'</th>').join('');
 $('tb').innerHTML=r.length?r.map(x=>'<tr>'+x.map((c,i)=>'<td'+(i==0&&!m?' style="text-align:left"':'')+'>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="4" style="background:#fff">No hay resultados con esos filtros.</td></tr>';
 $('cnt').textContent='Mostrando '+r.length+' de '+D().length+(m?' cursos':' programas');}
$('hd').addEventListener('click',e=>{const t=e.target.closest('th');if(!t)return;const c=+t.dataset.c;asc=sc===c?-asc:1;sc=c;render()});
$('hd').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.click()});
$('bus').onclick=render;[0,1].forEach(k=>$('f'+k).onchange=render);
[0,1].forEach(k=>$('t'+k).onclick=()=>{m=k;sc=-1;[0,1].forEach(j=>$('t'+j).setAttribute('aria-selected',j===k));fill();render()});
fill();render();</script></body></html>
